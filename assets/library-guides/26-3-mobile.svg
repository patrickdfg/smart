<svg xmlns="http://www.w3.org/2000/svg" width="340" height="500" viewBox="55 10 340 500" role="img" aria-labelledby="title desc"><title id="title">저장된 가족 번호로 확인해요</title><desc id="desc">연락처 확인: 내가 저장한 가족 번호 → 직접 전화해 사실 확인 → 전화하기</desc><rect width="800" height="520" rx="22" fill="#f0f5f8"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="65" y="18" width="320" height="482" rx="30" fill="#203e52"/><rect x="77" y="30" width="296" height="458" rx="23" fill="white"/><text x="225" y="72" text-anchor="middle" font-size="23" font-weight="700" fill="#183f50">연락처 확인</text><rect x="93" y="98" width="264" height="114" rx="10" fill="#fbe7da"/><path d="M194 119q-24 28 24 65t40-12l-20-14-14 9-15-16 8-13Z" fill="#183f50"/><rect x="92" y="232" width="266" height="66" rx="10" fill="#eef3f7"/><text x="225" y="272" text-anchor="middle" font-size="20" fill="#183f50">내가 저장한 가족 번호</text><rect x="92" y="314" width="266" height="66" rx="10" fill="#eef3f7"/><text x="225" y="354" text-anchor="middle" font-size="20" fill="#183f50">직접 전화해 사실 확인</text><rect x="92" y="402" width="266" height="65" rx="12" fill="#08766d" stroke="#d36523" stroke-width="5"/><text x="225" y="442" text-anchor="middle" font-size="23" font-weight="700" fill="white">전화하기</text><circle cx="475" cy="134" r="34" fill="#183f50"/><text x="475" y="146" text-anchor="middle" font-size="34" fill="white">3</text><text x="430" y="216" font-size="28" font-weight="700" fill="#183f50">전화하기</text><text x="430" y="266" font-size="23" fill="#34495d">주황색 테두리를</text><text x="430" y="301" font-size="23" fill="#34495d">확인하며 따라해요</text><path d="M480 350Q465 433 379 434" fill="none" stroke="#d36523" stroke-width="7"/><path d="M395 417l-22 17 24 14" fill="none" stroke="#d36523" stroke-width="7"/><text x="430" y="480" font-size="19" fill="#526775">교육용 설명 그림</text></g></svg>