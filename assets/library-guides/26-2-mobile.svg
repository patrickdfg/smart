<svg xmlns="http://www.w3.org/2000/svg" width="340" height="500" viewBox="55 10 340 500" role="img" aria-labelledby="title desc"><title id="title">돈 요구나 낯선 링크는 멈춰요</title><desc id="desc">의심스러운 연락: 급하게 돈을 보내줘 → 낯선 링크 누르지 않기 → 멈추고 확인</desc><rect width="800" height="520" rx="22" fill="#f0f5f8"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="65" y="18" width="320" height="482" rx="30" fill="#203e52"/><rect x="77" y="30" width="296" height="458" rx="23" fill="white"/><text x="225" y="72" text-anchor="middle" font-size="23" font-weight="700" fill="#183f50">의심스러운 연락</text><rect x="93" y="98" width="264" height="114" rx="10" fill="#fbe7da"/><path d="M194 119q-24 28 24 65t40-12l-20-14-14 9-15-16 8-13Z" fill="#183f50"/><circle cx="286" cy="126" r="25" fill="#bb3e29"/><text x="286" y="138" text-anchor="middle" font-size="34" fill="white">!</text><rect x="92" y="232" width="266" height="66" rx="10" fill="#eef3f7"/><text x="225" y="272" text-anchor="middle" font-size="20" fill="#183f50">급하게 돈을 보내줘</text><rect x="92" y="314" width="266" height="66" rx="10" fill="#eef3f7"/><text x="225" y="354" text-anchor="middle" font-size="20" fill="#183f50">낯선 링크 누르지 않기</text><rect x="92" y="402" width="266" height="65" rx="12" fill="#08766d" stroke="#d36523" stroke-width="5"/><text x="225" y="442" text-anchor="middle" font-size="23" font-weight="700" fill="white">멈추고 확인</text><circle cx="475" cy="134" r="34" fill="#183f50"/><text x="475" y="146" text-anchor="middle" font-size="34" fill="white">2</text><text x="430" y="216" font-size="28" font-weight="700" fill="#183f50">멈추고 확인</text><text x="430" y="266" font-size="23" fill="#34495d">주황색 테두리를</text><text x="430" y="301" font-size="23" fill="#34495d">확인하며 따라해요</text><path d="M480 350Q465 433 379 434" fill="none" stroke="#d36523" stroke-width="7"/><path d="M395 417l-22 17 24 14" fill="none" stroke="#d36523" stroke-width="7"/><text x="430" y="480" font-size="19" fill="#526775">교육용 설명 그림</text></g></svg>