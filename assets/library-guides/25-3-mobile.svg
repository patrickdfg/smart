<svg xmlns="http://www.w3.org/2000/svg" width="340" height="500" viewBox="55 10 340 500" role="img" aria-labelledby="title desc"><title id="title">휴대전화 결제 화면을 살펴봐요</title><desc id="desc">삼성월렛 안내: 등록한 카드 확인 → 지문 / 비밀번호 인증 → 결제 화면 확인</desc><rect width="800" height="520" rx="22" fill="#f0f5f8"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="65" y="18" width="320" height="482" rx="30" fill="#203e52"/><rect x="77" y="30" width="296" height="458" rx="23" fill="white"/><text x="225" y="72" text-anchor="middle" font-size="23" font-weight="700" fill="#183f50">삼성월렛 안내</text><rect x="93" y="98" width="264" height="114" rx="10" fill="#e4eff8"/><rect x="145" y="117" width="160" height="78" rx="10" fill="#183f50"/><path d="M145 139h160" stroke="#f4bd60" stroke-width="13"/><circle cx="279" cy="176" r="8" fill="#8dcbbd"/><rect x="92" y="232" width="266" height="66" rx="10" fill="#eef3f7"/><text x="225" y="272" text-anchor="middle" font-size="20" fill="#183f50">등록한 카드 확인</text><rect x="92" y="314" width="266" height="66" rx="10" fill="#eef3f7"/><text x="225" y="354" text-anchor="middle" font-size="20" fill="#183f50">지문 / 비밀번호 인증</text><rect x="92" y="402" width="266" height="65" rx="12" fill="#08766d" stroke="#d36523" stroke-width="5"/><text x="225" y="442" text-anchor="middle" font-size="23" font-weight="700" fill="white">결제 화면 확인</text><circle cx="475" cy="134" r="34" fill="#183f50"/><text x="475" y="146" text-anchor="middle" font-size="34" fill="white">3</text><text x="430" y="216" font-size="28" font-weight="700" fill="#183f50">결제 화면 확인</text><text x="430" y="266" font-size="23" fill="#34495d">주황색 테두리를</text><text x="430" y="301" font-size="23" fill="#34495d">확인하며 따라해요</text><path d="M480 350Q465 433 379 434" fill="none" stroke="#d36523" stroke-width="7"/><path d="M395 417l-22 17 24 14" fill="none" stroke="#d36523" stroke-width="7"/><text x="430" y="480" font-size="19" fill="#526775">교육용 설명 그림</text></g></svg>