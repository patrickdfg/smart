<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title desc"><title id="title">궁금한 점과 소감을 나눠요</title><desc id="desc">함께 이야기: 궁금한 점 질문 → 수업 소감 나누기 → 차례로 말하기</desc><rect width="800" height="520" rx="22" fill="#f0f5f8"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="65" y="18" width="320" height="482" rx="30" fill="#203e52"/><rect x="77" y="30" width="296" height="458" rx="23" fill="white"/><text x="225" y="72" text-anchor="middle" font-size="23" font-weight="700" fill="#183f50">함께 이야기</text><rect x="93" y="98" width="264" height="114" rx="10" fill="#dceeea"/><path d="M177 154l32 28 65-60" fill="none" stroke="#08766d" stroke-width="13" stroke-linecap="round"/><rect x="92" y="232" width="266" height="66" rx="10" fill="#eef3f7"/><text x="225" y="272" text-anchor="middle" font-size="20" fill="#183f50">궁금한 점 질문</text><rect x="92" y="314" width="266" height="66" rx="10" fill="#eef3f7"/><text x="225" y="354" text-anchor="middle" font-size="20" fill="#183f50">수업 소감 나누기</text><rect x="92" y="402" width="266" height="65" rx="12" fill="#08766d" stroke="#d36523" stroke-width="5"/><text x="225" y="442" text-anchor="middle" font-size="23" font-weight="700" fill="white">차례로 말하기</text><circle cx="475" cy="134" r="34" fill="#183f50"/><text x="475" y="146" text-anchor="middle" font-size="34" fill="white">1</text><text x="430" y="216" font-size="28" font-weight="700" fill="#183f50">차례로 말하기</text><text x="430" y="266" font-size="23" fill="#34495d">주황색 테두리를</text><text x="430" y="301" font-size="23" fill="#34495d">확인하며 따라해요</text><path d="M480 350Q465 433 379 434" fill="none" stroke="#d36523" stroke-width="7"/><path d="M395 417l-22 17 24 14" fill="none" stroke="#d36523" stroke-width="7"/><text x="430" y="480" font-size="19" fill="#526775">교육용 설명 그림</text></g></svg>